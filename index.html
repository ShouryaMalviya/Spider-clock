<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spider Clock | Animated Analog Timepiece</title>
  <meta name="description" content="An advanced, interactive, animated Spider Clock featuring an articulated white spider whose front legs act as hour and minute hands, with procedural catenary web, synthesized Web Audio, and 3D parallax.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Atmospheric Radial Vignette & Silk Mote Particles -->
  <div class="ambient-glow" id="ambientGlow"></div>
  <canvas id="ambientCanvas" class="ambient-canvas"></canvas>

  <!-- Hanging Silk Thread from Top Center of Screen (y = 0) to Center (400, 400) -->
  <div class="silk-thread-container" aria-hidden="true">
    <div class="silk-thread" id="silkThread">
      <div class="silk-shimmer"></div>
    </div>
  </div>

  <!-- Main Clock Stage -->
  <main class="clock-stage" id="clockStage" role="main" aria-label="Spider Analog Clock">
    
    <div class="clock-wrapper" id="clockWrapper">
      <svg id="spiderClockSvg" class="clock-svg"  viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Radial Web Shading & Filters -->
          <radialGradient id="webRadialFade" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
            <stop offset="85%" stop-color="#ffffff" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
          </radialGradient>

          <!-- Dew Drop Luminous Pearl Gradient -->
          <radialGradient id="dewDropGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
            <stop offset="35%" stop-color="#F0F9FF" stop-opacity="0.95"/>
            <stop offset="75%" stop-color="#BAE6FD" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.6"/>
          </radialGradient>

          <!-- Spider Pearl Gradient -->
          <linearGradient id="spiderWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="45%" stop-color="#F8FAFC"/>
            <stop offset="80%" stop-color="#E2E8F0"/>
            <stop offset="100%" stop-color="#CBD5E1"/>
          </linearGradient>

          <!-- Spider Carapace Highlight Gradient -->
          <linearGradient id="spiderHighlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.2"/>
          </linearGradient>

          <!-- Golden/Ivory Accent Gradient -->
          <linearGradient id="spiderAccentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#F1F5F9"/>
          </linearGradient>

          <!-- Luminous Second Hand Gradient -->
          <linearGradient id="secondHandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
            <stop offset="65%" stop-color="#BAE6FD" stop-opacity="0.95"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.85"/>
          </linearGradient>

          <!-- Shadow & Glow Filters -->
          <filter id="spiderShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="7" stdDeviation="5.5" flood-color="#020B14" flood-opacity="0.65"/>
          </filter>

          <filter id="handShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="1" dy="4" stdDeviation="4" flood-color="#020B14" flood-opacity="0.55"/>
          </filter>

          <filter id="glowSubtle" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="2" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>

          <filter id="secondGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.5" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- LAYER 1: Procedural Web & Mandala Pattern (Center is 400, 400) -->
        <g id="webGroup" class="web-group">
          <!-- Central Sacred Mandala Rosette Petals behind the spider -->
          <g id="mandalaRings" class="mandala-rings"></g>
          <!-- 12 Radial Spokes aligning exactly with hour marks -->
          <g id="radialSpokes" class="radial-spokes"></g>
          <!-- 6 Concentric Sagging Catenary Web Rings -->
          <g id="spiralStrands" class="spiral-strands"></g>
          <!-- Morning Dew Drop Accents -->
          <g id="dewDrops" class="dew-drops"></g>
        </g>

        <!-- LAYER 2: Minute Ticks & Hour Pips -->
        <g id="dialTicks" class="dial-ticks"></g>

        <!-- LAYER 3: Clock Face Numbers 1 to 12 (Modern sans-serif typography with drop shadows) -->
        <g id="numbersGroup" class="numbers-group" role="presentation"></g>

        <!-- Unbroken Illuminated SVG Silk Line extending from screen top (y = 0) down to center (400, 400) -->
        <g id="svgSilkGroup" class="svg-silk-group">
          <line class="svg-silk-glow" x1="400" y1="-800" x2="400" y2="400" stroke="rgba(224, 242, 254, 0.55)" stroke-width="3" filter="url(#glowSubtle)" />
          <line class="svg-silk-core" x1="400" y1="-800" x2="400" y2="400" stroke="#FFFFFF" stroke-width="1.6" />
          <!-- Animated traveling shimmer packet sliding down the silk line into the spider center -->
          <line class="svg-silk-pulse" x1="400" y1="-800" x2="400" y2="400" stroke="#FFFFFF" stroke-width="2.8" stroke-dasharray="45 380" stroke-linecap="round">
            <animate attributeName="stroke-dashoffset" from="425" to="0" dur="3s" repeatCount="indefinite" />
          </line>
        </g>

        <!-- LAYER 4: Static Resting Spider Legs (Pairs 2, 3, 4 = 6 Legs) -->
        <!-- Articulated legs spanning gracefully to touch the outer web strands with staggered idle breathing -->
        <g id="spiderRestingLegs" class="spider-resting-legs" filter="url(#spiderShadow)">
          
          <!-- LEFT SIDE 3 LEGS -->
          <!-- Leg L2: Front-mid left spanning to upper outer strand -->
          <g id="legGroupL2" class="resting-leg-group leg-l2">
            <path class="resting-leg-stroke" d="M 390 395 Q 355 372 318 350 Q 285 330 258 290 Q 248 275 242 250" />
            <circle class="resting-leg-joint" cx="318" cy="350" r="3.2" />
            <circle class="resting-leg-joint" cx="258" cy="290" r="2.5" />
            <polygon class="resting-leg-claw" points="240,248 245,250 242,254" />
          </g>

          <!-- Leg L3: Middle left spanning to side outer strand -->
          <g id="legGroupL3" class="resting-leg-group leg-l3">
            <path class="resting-leg-stroke" d="M 388 404 Q 345 398 298 408 Q 256 422 225 458 Q 212 478 202 505" />
            <circle class="resting-leg-joint" cx="298" cy="408" r="3.2" />
            <circle class="resting-leg-joint" cx="225" cy="458" r="2.5" />
            <polygon class="resting-leg-claw" points="200,503 205,505 203,509" />
          </g>

          <!-- Leg L4: Rear left spanning to lower outer strand -->
          <g id="legGroupL4" class="resting-leg-group leg-l4">
            <path class="resting-leg-stroke" d="M 391 415 Q 352 432 308 472 Q 284 508 272 550 Q 266 572 262 596" />
            <circle class="resting-leg-joint" cx="308" cy="472" r="3.2" />
            <circle class="resting-leg-joint" cx="272" cy="550" r="2.5" />
            <polygon class="resting-leg-claw" points="260,594 265,596 262,600" />
          </g>

          <!-- RIGHT SIDE 3 LEGS -->
          <!-- Leg R2: Front-mid right spanning to upper outer strand -->
          <g id="legGroupR2" class="resting-leg-group leg-r2">
            <path class="resting-leg-stroke" d="M 410 395 Q 445 372 482 350 Q 515 330 542 290 Q 552 275 558 250" />
            <circle class="resting-leg-joint" cx="482" cy="350" r="3.2" />
            <circle class="resting-leg-joint" cx="542" cy="290" r="2.5" />
            <polygon class="resting-leg-claw" points="560,248 555,250 558,254" />
          </g>

          <!-- Leg R3: Middle right spanning to side outer strand -->
          <g id="legGroupR3" class="resting-leg-group leg-r3">
            <path class="resting-leg-stroke" d="M 412 404 Q 455 398 502 408 Q 544 422 575 458 Q 588 478 598 505" />
            <circle class="resting-leg-joint" cx="502" cy="408" r="3.2" />
            <circle class="resting-leg-joint" cx="575" cy="458" r="2.5" />
            <polygon class="resting-leg-claw" points="600,503 595,505 597,509" />
          </g>

          <!-- Leg R4: Rear right spanning to lower outer strand -->
          <g id="legGroupR4" class="resting-leg-group leg-r4">
            <path class="resting-leg-stroke" d="M 409 415 Q 448 432 492 472 Q 516 508 528 550 Q 534 572 538 596" />
            <circle class="resting-leg-joint" cx="492" cy="472" r="3.2" />
            <circle class="resting-leg-joint" cx="528" cy="550" r="2.5" />
            <polygon class="resting-leg-claw" points="540,594 535,596 538,600" />
          </g>
        </g>

        <!-- LAYER 5: Dynamic Clock Hands (Integrated Spider Front Legs & Luminous Second Filament) -->
        <g id="clockHandsGroup" class="clock-hands-group">
          
          <!-- HOUR HAND: Front-Left Spider Leg, fully articulated with realistic joints -->
          <!-- Coxa, femur, patella, tibia, and pointer claw, rotating around (400, 400) -->
          <g id="hourHandWrapper" class="hand-wrapper" filter="url(#handShadow)">
            <g id="hourHand" class="spider-leg-hand hour-hand">
              <!-- Coxa & Femur Segment -->
              <path class="leg-segment segment-coxa" d="M 398 400 Q 394 365, 392 342 Q 391 328, 388 312" />
              <!-- Patella / Knee Joint -->
              <circle class="leg-joint" cx="388" cy="312" r="4.2" />
              <!-- Tibia & Metatarsus -->
              <path class="leg-segment segment-tibia" d="M 388 312 Q 393 285, 397 260 Q 399 245, 399 232" />
              <!-- Articulated Joint Pip -->
              <circle class="leg-joint-subtle" cx="399" cy="232" r="2.8" />
              <!-- Tarsus / Pointer Claw pointing accurately to the hour -->
              <path class="leg-segment segment-claw" d="M 399 232 L 400 216" />
              <polygon class="leg-tip-indicator" points="397.5,218 402.5,218 400,212" />
            </g>
          </g>

          <!-- MINUTE HAND: Front-Right Spider Leg, longer and sleeker -->
          <!-- Articulated joints pointing precisely to the minute marks -->
          <g id="minuteHandWrapper" class="hand-wrapper" filter="url(#handShadow)">
            <g id="minuteHand" class="spider-leg-hand minute-hand">
              <!-- Coxa & Femur Segment (longer) -->
              <path class="leg-segment segment-coxa-long" d="M 402 400 Q 406 355, 410 320 Q 412 290, 412 265" />
              <!-- Patella / Knee Joint -->
              <circle class="leg-joint" cx="412" cy="265" r="3.8" />
              <!-- Tibia & Metatarsus -->
              <path class="leg-segment segment-tibia-long" d="M 412 265 Q 408 225, 404 195 Q 402 175, 401 155" />
              <!-- Joint Pip -->
              <circle class="leg-joint-subtle" cx="401" cy="155" r="2.4" />
              <!-- Tarsus / Sleek Needle Claw extending out to the minutes -->
              <path class="leg-segment segment-claw-long" d="M 401 155 L 400 148" />
              <polygon class="leg-tip-indicator minute-tip" points="398,150 402,150 400,142" />
            </g>
          </g>

          <!-- SECOND HAND: Ultra-thin Luminous Silk Filament with glowing droplet marker -->
          <!-- Rotates continuously around (400, 400) -->
          <g id="secondHandWrapper" class="hand-wrapper" filter="url(#secondGlow)">
            <g id="secondHand" class="second-filament-hand">
              <!-- Counterbalance tail extending down -->
              <line class="second-tail" x1="400" y1="400" x2="400" y2="445" />
              <circle class="second-tail-pip" cx="400" cy="445" r="2.2" />
              <!-- Ultra-thin luminous needle reaching past minute marks -->
              <line class="second-needle" x1="400" y1="400" x2="400" y2="128" />
              <!-- Glowing morning-dew silk droplet marker near the tip -->
              <circle class="second-droplet" cx="400" cy="148" r="3.2" />
              <circle class="second-droplet-glow" cx="400" cy="148" r="1.5" fill="#FFFFFF" />
              <!-- Glowing needle tip -->
              <circle class="second-tip-pip" cx="400" cy="128" r="1.8" />
            </g>
          </g>

        </g>

        <!-- LAYER 6: Beautifully Crafted White Spider Body resting exactly at center (400, 400) -->
        <g id="spiderBodyGroup" class="spider-body-group" filter="url(#spiderShadow)">
          
          <!-- Silk Spinneret Anchor Point at Top of Spider Body (connected to silk thread) -->
          <path class="spinneret-anchor" d="M 397 372 L 403 372 L 400 368 Z" fill="#FFFFFF" />

          <!-- Spider Abdomen (Posterior bulb) with organic shape -->
          <ellipse class="spider-abdomen" cx="400" cy="420" rx="15" ry="21" fill="url(#spiderWhiteGrad)" />
          
          <!-- Abdomen Carapace Pattern (Delicate golden-amber lace markings) -->
          <path class="abdomen-carapace" d="M 400 404 Q 403 416 400 430 Q 397 416 400 404" fill="none" stroke="rgba(163, 78, 1, 0.45)" stroke-width="1.2" />
          <line x1="394" y1="414" x2="406" y2="414" stroke="rgba(163, 78, 1, 0.35)" stroke-width="1" />
          <line x1="393" y1="422" x2="407" y2="422" stroke="rgba(163, 78, 1, 0.35)" stroke-width="1" />
          <line x1="395" y1="430" x2="405" y2="430" stroke="rgba(163, 78, 1, 0.35)" stroke-width="1" />
          
          <!-- Carapace dorsal sheen -->
          <ellipse cx="398" cy="416" rx="6" ry="12" fill="url(#spiderHighlightGrad)" />

          <!-- Pedicel (connection waist) -->
          <rect x="398" y="399" width="4" height="4.5" rx="2" fill="#E2E8F0" />

          <!-- Spider Cephalothorax (Head & Thorax) -->
          <ellipse class="spider-thorax" cx="400" cy="392" rx="12.5" ry="11.5" fill="url(#spiderWhiteGrad)" />
          
          <!-- Chelicerae / Fangs & Pedipalps (Front mouthparts) -->
          <path class="spider-pedipalp-l" d="M 394 382 Q 392 375 390 372" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none" />
          <path class="spider-pedipalp-r" d="M 406 382 Q 408 375 410 372" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" fill="none" />
          <polygon class="spider-fang-l" points="397,377 395,373 397,374" fill="#6d2806" />
          <polygon class="spider-fang-r" points="403,377 405,373 403,374" fill="#6d2806" />

          <!-- Spider Eyes (8 Arachnid Eyes with dynamic cursor pupil tracking) -->
          <g id="spiderEyesCluster" class="spider-eyes-cluster">
            <!-- Eye sockets / dark chitin ring -->
            <ellipse cx="396.5" cy="385" rx="3.5" ry="3.5" fill="#2a1205" stroke="#451a03" stroke-width="0.8" />
            <ellipse cx="403.5" cy="385" rx="3.5" ry="3.5" fill="#2a1205" stroke="#451a03" stroke-width="0.8" />
            
            <!-- Primary Central Eyes (Anterior Median Eyes) -->
            <circle cx="396.5" cy="385" r="3" fill="#180a02" />
            <circle cx="403.5" cy="385" r="3" fill="#180a02" />
            
            <!-- Glowing Amber/Ruby Irises -->
            <circle cx="396.5" cy="385" r="2.4" fill="#6d2806" />
            <circle cx="403.5" cy="385" r="2.4" fill="#6d2806" />

            <!-- Dynamic Tracking Pupils (Follow mouse cursor across the screen) -->
            <g id="spiderPupils">
              <circle class="spider-pupil" cx="396.5" cy="385" r="1.5" fill="#000000" />
              <circle class="spider-pupil" cx="403.5" cy="385" r="1.5" fill="#000000" />
              <!-- Glossy Corneal Specular Highlights -->
              <circle class="spider-pupil-highlight" cx="395.8" cy="384.2" r="0.75" fill="#FFFFFF" />
              <circle class="spider-pupil-highlight" cx="402.8" cy="384.2" r="0.75" fill="#FFFFFF" />
            </g>

            <!-- Secondary Lateral & Posterior Eyes -->
            <circle cx="392" cy="387" r="1.6" fill="#2a1205" stroke="#6d2806" stroke-width="0.5" />
            <circle cx="408" cy="387" r="1.6" fill="#2a1205" stroke="#6d2806" stroke-width="0.5" />
            <circle class="secondary-pupil" cx="392" cy="387" r="0.9" fill="#000000" />
            <circle class="secondary-pupil" cx="408" cy="387" r="0.9" fill="#000000" />

            <circle cx="390.5" cy="390" r="1.2" fill="#2a1205" />
            <circle cx="409.5" cy="390" r="1.2" fill="#2a1205" />
          </g>

          <!-- Center Pivot Pearl (Jewel cap covering hand rotation axis at 400, 400) -->
          <circle class="center-pearl" cx="400" cy="400" r="4.8" fill="url(#spiderAccentGrad)" stroke="#CBD5E1" stroke-width="1.2" />
          <circle class="center-pearl-glow" cx="398.8" cy="398.8" r="1.8" fill="#FFFFFF" />
        </g>

      </svg>
    </div>

    <!-- Butterfly Luminous Stardust Particle Trail Canvas -->
    <canvas id="butterflyTrailCanvas" class="butterfly-trail-canvas"></canvas>

    <!-- Glowing Ethereal Cyan Butterfly -->
    <div class="butterfly-container" id="butterflyContainer" aria-label="Glowing Ethereal Butterfly" role="img">
      <div class="butterfly" id="butterfly">
        <!-- SVG Definitions for Gradients and Filters -->
        <svg class="butterfly-defs-svg" width="0" height="0" style="position: absolute;">
          <defs>
            <linearGradient id="bfWingGrad" x1="100%" y1="40%" x2="0%" y2="50%">
              <stop offset="0%" stop-color="#0284c7" stop-opacity="0.95"/>
              <stop offset="35%" stop-color="#00f0ff" stop-opacity="0.8"/>
              <stop offset="75%" stop-color="#38bdf8" stop-opacity="0.65"/>
              <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9"/>
            </linearGradient>
            <linearGradient id="bfVeinGrad" x1="100%" y1="50%" x2="0%" y2="50%">
              <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85"/>
              <stop offset="60%" stop-color="#7dd3fc" stop-opacity="0.6"/>
              <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3"/>
            </linearGradient>
            <radialGradient id="bfEyeGrad" cx="35%" cy="35%" r="65%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="60%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </radialGradient>
            <linearGradient id="bfBodyGrad" x1="50%" y1="0%" x2="50%" y2="100%">
              <stop offset="0%" stop-color="#0284c7"/>
              <stop offset="30%" stop-color="#075985"/>
              <stop offset="70%" stop-color="#032b43"/>
              <stop offset="100%" stop-color="#021422"/>
            </linearGradient>
            <filter id="bfWingGlow" x="-30%" y="-30%" width="160%" height="160%">
              <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#00f0ff" flood-opacity="0.85"/>
            </filter>
          </defs>
        </svg>

        <!-- Left Wing Assembly (Flaps around right margin / body) -->
        <div class="butterfly-wing butterfly-wing-left">
          <svg class="wing-svg" viewBox="0 0 34 48" preserveAspectRatio="none">
            <!-- Wing Base Surface with Glow and Cyan/Teal Gradient -->
            <!-- Forewing (upper) -->
            <path class="wing-surface forewing" d="M 34 22 C 30 11, 24 3, 9 2 C 2 1.5, 0.5 8, 3 18 C 6 27, 16 35, 34 36 Z" fill="url(#bfWingGrad)" stroke="#38bdf8" stroke-width="0.9" filter="url(#bfWingGlow)"/>
            <!-- Hindwing (lower) -->
            <path class="wing-surface hindwing" d="M 34 30 C 26 31, 8 36, 6 42 C 4 47, 14 48, 22 47 C 28 46, 32 40, 34 36 Z" fill="url(#bfWingGrad)" stroke="#38bdf8" stroke-width="0.9" filter="url(#bfWingGlow)"/>
            <!-- Delicate Semi-Transparent Vein Patterns -->
            <g class="wing-veins" stroke="url(#bfVeinGrad)" stroke-width="0.75" fill="none">
              <path d="M 34 24 Q 22 14 10 3" />
              <path d="M 34 24 Q 18 20 4 17" />
              <path d="M 34 24 Q 19 28 8 28" />
              <path d="M 34 32 Q 22 38 8 42" />
              <path d="M 34 32 Q 26 44 20 46" />
            </g>
            <!-- Luminous Pearlescent Edge Accent Dots -->
            <circle cx="9" cy="3.5" r="1" fill="#ffffff" opacity="0.9"/>
            <circle cx="3" cy="14" r="0.9" fill="#ffffff" opacity="0.85"/>
            <circle cx="5" cy="24" r="0.8" fill="#ffffff" opacity="0.8"/>
            <circle cx="8" cy="42" r="0.8" fill="#ffffff" opacity="0.8"/>
            <circle cx="18" cy="46.5" r="0.8" fill="#ffffff" opacity="0.8"/>
          </svg>
        </div>

        <!-- Right Wing Assembly (Mirrored, flaps around left margin / body) -->
        <div class="butterfly-wing butterfly-wing-right">
          <svg class="wing-svg" viewBox="0 0 34 48" preserveAspectRatio="none">
            <!-- Mirrored group using scaleX(-1) -->
            <g transform="translate(34, 0) scale(-1, 1)">
              <!-- Forewing (upper) -->
              <path class="wing-surface forewing" d="M 34 22 C 30 11, 24 3, 9 2 C 2 1.5, 0.5 8, 3 18 C 6 27, 16 35, 34 36 Z" fill="url(#bfWingGrad)" stroke="#38bdf8" stroke-width="0.9" filter="url(#bfWingGlow)"/>
              <!-- Hindwing (lower) -->
              <path class="wing-surface hindwing" d="M 34 30 C 26 31, 8 36, 6 42 C 4 47, 14 48, 22 47 C 28 46, 32 40, 34 36 Z" fill="url(#bfWingGrad)" stroke="#38bdf8" stroke-width="0.9" filter="url(#bfWingGlow)"/>
              <!-- Delicate Semi-Transparent Vein Patterns -->
              <g class="wing-veins" stroke="url(#bfVeinGrad)" stroke-width="0.75" fill="none">
                <path d="M 34 24 Q 22 14 10 3" />
                <path d="M 34 24 Q 18 20 4 17" />
                <path d="M 34 24 Q 19 28 8 28" />
                <path d="M 34 32 Q 22 38 8 42" />
                <path d="M 34 32 Q 26 44 20 46" />
              </g>
              <!-- Luminous Pearlescent Edge Accent Dots -->
              <circle cx="9" cy="3.5" r="1" fill="#ffffff" opacity="0.9"/>
              <circle cx="3" cy="14" r="0.9" fill="#ffffff" opacity="0.85"/>
              <circle cx="5" cy="24" r="0.8" fill="#ffffff" opacity="0.8"/>
              <circle cx="8" cy="42" r="0.8" fill="#ffffff" opacity="0.8"/>
              <circle cx="18" cy="46.5" r="0.8" fill="#ffffff" opacity="0.8"/>
            </g>
          </svg>
        </div>

        <!-- Butterfly Slender Chitin Body & Antennae -->
        <div class="butterfly-body">
          <svg class="body-svg" viewBox="0 0 12 48" preserveAspectRatio="none">
            <!-- Curved Antennae with Glowing Cyan Orb Tips -->
            <path d="M 5 12 Q 2 6, 0.5 4" stroke="#7dd3fc" stroke-width="0.7" fill="none"/>
            <circle cx="0.5" cy="4" r="1" fill="#00f0ff" filter="url(#bfWingGlow)"/>
            <path d="M 7 12 Q 10 6, 11.5 4" stroke="#7dd3fc" stroke-width="0.7" fill="none"/>
            <circle cx="11.5" cy="4" r="1" fill="#00f0ff" filter="url(#bfWingGlow)"/>
            <!-- Head -->
            <ellipse cx="6" cy="14" rx="2.4" ry="2.2" fill="url(#bfBodyGrad)"/>
            <!-- Glowing Eyes -->
            <circle cx="4.8" cy="13.5" r="0.9" fill="url(#bfEyeGrad)"/>
            <circle cx="7.2" cy="13.5" r="0.9" fill="url(#bfEyeGrad)"/>
            <!-- Thorax -->
            <ellipse cx="6" cy="20" rx="2.8" ry="4.5" fill="url(#bfBodyGrad)"/>
            <!-- Abdomen with Chitin Segmentation -->
            <ellipse cx="6" cy="31" rx="2.2" ry="7.5" fill="url(#bfBodyGrad)"/>
            <line x1="4.2" y1="27" x2="7.8" y2="27" stroke="#38bdf8" stroke-width="0.5" opacity="0.7"/>
            <line x1="4.0" y1="30" x2="8.0" y2="30" stroke="#38bdf8" stroke-width="0.5" opacity="0.7"/>
            <line x1="4.2" y1="33" x2="7.8" y2="33" stroke="#38bdf8" stroke-width="0.5" opacity="0.7"/>
            <line x1="4.5" y1="36" x2="7.5" y2="36" stroke="#38bdf8" stroke-width="0.5" opacity="0.7"/>
            <!-- Dorsal Luminescent Ridge -->
            <line x1="6" y1="18" x2="6" y2="36" stroke="#00f0ff" stroke-width="0.6" opacity="0.8" filter="url(#bfWingGlow)"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Floating Glassmorphic HUD Pill Bar -->
    <footer class="hud-bar" id="hudBar">
      <!-- Digital Time Readout -->
      <div class="time-readout" id="digitalTimeBadge" title="Local Time">
        <span class="digital-time" id="digitalTime">12:00:00</span>
        <span class="digital-ampm" id="digitalAmPm">PM</span>
      </div>

      <!-- Controls -->
      <div class="hud-controls">
        <!-- Smooth vs Stepped Sweep Toggle -->
        <button type="button" class="hud-btn" id="sweepToggleBtn" title="Toggle Smooth vs. Stepped Second Hand Sweep" aria-label="Toggle second hand sweep mode">
          <svg class="hud-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 15 15"/>
          </svg>
          <span id="sweepModeLabel">Smooth</span>
        </button>

        <!-- Ambient Web Audio Silk Tick / Chime Toggle -->
        <button type="button" class="hud-btn" id="soundToggleBtn" title="Toggle Ambient Synthesized Silk Tick and Chimes" aria-label="Toggle ambient sound">
          <svg class="hud-icon" id="soundIcon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <line id="soundMuteSlash" x1="1" y1="1" x2="23" y2="23" stroke="#F87171" stroke-width="2.5" />
          </svg>
          <span id="soundLabel">Sound Off</span>
        </button>

        <!-- Interactive Pluck Web Button -->
        <button type="button" class="hud-btn" id="webPulseBtn" title="Pluck Web Strands (Multi-harmonic Harp Chime)" aria-label="Pluck web strands">
          <svg class="hud-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07l14.14-14.14"/>
          </svg>
          <span>Pluck Web</span>
        </button>
      </div>
    </footer>

  </main>

  <script src="script.js"></script>
</body>
</html>
